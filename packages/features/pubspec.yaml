name: poseperfect_features
description: Feature-level Flutter widgets and view models.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  poseperfect_domain: ^0.1.0
  poseperfect_data: ^0.1.0
  # Issue #8 exercises the camera on purpose: it is the one permission the whole
  # product depends on, and free-team signing is exactly where it would fail.
  camera: ^0.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
